name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # The Maven wrapper in this repo is old (Maven 3.5.4), so use the runner's Maven.
      - name: Run tests
        run: mvn -B test
